name: SEA binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: packaging/sea/node-version
          cache: npm
      - run: npm ci
      - name: Check release tag and native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node scripts/check-sea-release.mjs
      - run: npm test
      - run: npm run sea:dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create a reviewable draft (never auto-publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "remocon $RELEASE_TAG" --notes "Standalone SEA binaries. See INSTALL.md inside each archive. Default builds are unsigned on Windows and ad-hoc signed, not notarized, on macOS."
